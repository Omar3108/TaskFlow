name: CI

on:
  push:
  pull_request:

# Cancel superseded runs of the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Integration tests start PostgreSQL through Testcontainers; Docker is preinstalled on the runner.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Fails if coverage drops below the minimums in vite.config.ts.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright against Docker Compose)
    runs-on: ubuntu-latest
    # Only worth the minutes once the unit and integration tests pass.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      # The example values are local-only placeholders, which is exactly what CI needs.
      - name: Create .env
        run: cp .env.example .env

      - name: Start the whole app
        run: docker compose --profile app up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check and format
        working-directory: e2e
        run: npm run typecheck && npm run format:check

      - name: Run end-to-end tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results

      - name: Container logs
        if: failure()
        run: docker compose --profile app logs --no-color

      - name: Stop the app
        if: always()
        run: docker compose --profile app down

  deploy:
    name: Deploy backend (Render)
    runs-on: ubuntu-latest
    # Continuous deployment: only main, and only when every test job passed. Render's own
    # auto-deploy is off, so nothing reaches production without going through CI first.
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger the deploy and wait for the new version
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ] || [ -z "$API_URL" ]; then
            echo "::notice::Deployment is not configured (secret RENDER_DEPLOY_HOOK_URL, variable API_URL). Skipping."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          # Health alone would pass on the old version; wait until /actuator/info reports this commit.
          for attempt in $(seq 1 60); do
            commit=$(curl -fsS "$API_URL/actuator/info" | jq -r '.app.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Version $commit is live."
              curl -fsS "$API_URL/actuator/health"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Commit $GITHUB_SHA was not live after 10 minutes (still serving: ${commit:-unknown})."
          exit 1
