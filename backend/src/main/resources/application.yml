spring:
  application:
    name: taskflow-api
  config:
    # Local development convenience: load the repository .env file if it exists (whether the
    # app is started from backend/ or from the repository root). Real environment variables
    # still take precedence, and in production there is no .env file at all.
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    # Defaults match docker-compose.yml and are meant for local development only.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USERNAME:taskflow}
    password: ${DB_PASSWORD:taskflow}
    hikari:
      # Free database plans allow few connections; a small pool also suits one small instance.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Keep transactions inside the service layer: no lazy loading during view rendering.
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Upper bound for ?size=, so one request cannot ask for an unbounded page.
        max-page-size: 100

server:
  port: ${PORT:8080}
  # Behind the hosting proxies (Vercel, Render) TLS ends before the app. Applying their
  # X-Forwarded-* headers gives the real scheme and client address (used by the demo limit).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health, info
  info:
    env:
      enabled: true

# Shown by /actuator/info. Render sets RENDER_GIT_COMMIT on every deploy; the CD job waits until
# it matches the commit it deployed.
info:
  app:
    commit: ${RENDER_GIT_COMMIT:local}

springdoc:
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    # No default on purpose: the application must not start without a signing key.
    # Base64-encoded, at least 32 bytes. Generate one with: openssl rand -base64 32
    secret: ${JWT_SECRET}
    issuer: taskflow
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:7d}
    # Secure by default. Set COOKIE_SECURE=false only for local development over plain HTTP.
    cookie-secure: ${COOKIE_SECURE:true}
  invitation:
    ttl: ${INVITATION_TTL:7d}
  demo:
    enabled: ${DEMO_ENABLED:true}
    ttl: ${DEMO_TTL:24h}
    max-per-ip-per-hour: ${DEMO_MAX_PER_IP_PER_HOUR:5}
    max-active: ${DEMO_MAX_ACTIVE:300}
  cors:
    # Comma-separated list of browser origins allowed to call the API.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
