# Security headers, the same as frontend/vercel.json, so the end-to-end tests run under the
# Content Security Policy that production uses. 'unsafe-inline' for styles only: the toast
# library injects a <style> element at runtime. Scripts stay 'self' only.
#
# Included in every location: nginx drops all inherited add_header directives in a location
# that declares its own (the Cache-Control ones), so headers set at server level would vanish.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
